name: Experiment 057 Test

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_057/**"
      - ".github/workflows/experiment-057.yml"
  workflow_dispatch:

jobs:
  verify-057:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_057/run_experiment.py
name: Experiment 052 End to End Revision Pipeline

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_052/**"
      - ".github/workflows/experiment-052.yml"
  workflow_dispatch:

jobs:
  verify-052:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_052/run_experiment.py
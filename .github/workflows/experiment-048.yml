name: Experiment 048 Core Revision Integration

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_048/**"
      - ".github/workflows/experiment-048.yml"
  workflow_dispatch:

jobs:
  verify-048:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_048/run_experiment.py
name: Experiment 039 Focused Verification

on:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_039/**"
      - ".github/workflows/experiment-039.yml"
  workflow_dispatch:

jobs:
  verify-039:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_039/run_experiment.py
name: Experiment 037 Focused Verification

on:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_037/**"
      - ".github/workflows/experiment-037.yml"
  workflow_dispatch:

jobs:
  verify-037:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_037/run_experiment.py
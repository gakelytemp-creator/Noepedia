name: Experiment 059 Strategy Policies

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_059/**"
      - ".github/workflows/experiment-059.yml"
  workflow_dispatch:

jobs:
  verify-059:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_059/run_experiment.py
name: Experiment 073 Motor1 Thermal Lag Hypothesis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_073/**"
      - ".github/workflows/experiment-073.yml"

jobs:
  verify-073:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - run: python experiments/experiment_073/run_experiment.py

name: Experiment 058 Strategy Policies

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_058/**"
      - ".github/workflows/experiment-058.yml"
  workflow_dispatch:

jobs:
  verify-058:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_058/run_experiment.py
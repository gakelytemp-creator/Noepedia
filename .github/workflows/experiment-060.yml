name: Experiment 060 Strategy Policies

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_060/**"
      - ".github/workflows/experiment-060.yml"
  workflow_dispatch:

jobs:
  verify-060:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_060/run_experiment.py
name: Experiment 067 Blind Real Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_067/**"
      - ".github/workflows/experiment-067.yml"

jobs:
  verify-067:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - run: python experiments/experiment_067/run_experiment.py

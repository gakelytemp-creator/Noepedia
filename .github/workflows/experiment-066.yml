name: Experiment 066

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_066/**"
      - ".github/workflows/experiment-066.yml"
  workflow_dispatch:

jobs:
  verify-066:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_066/run_experiment.py
name: Experiment 063

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_063/**"
      - ".github/workflows/experiment-063.yml"
  workflow_dispatch:

jobs:
  verify-063:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_063/run_experiment.py
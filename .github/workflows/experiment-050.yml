name: Experiment 050 Generic Candidate Evaluator

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_050/**"
      - ".github/workflows/experiment-050.yml"
  workflow_dispatch:

jobs:
  verify-050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_050/run_experiment.py
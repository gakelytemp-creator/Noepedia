name: Experiment 049 Candidate Generator Null Selector

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_049/**"
      - ".github/workflows/experiment-049.yml"
  workflow_dispatch:

jobs:
  verify-049:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_049/run_experiment.py
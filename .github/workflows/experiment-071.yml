name: Experiment 071 Blind Robot Telemetry Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_071/**"
      - ".github/workflows/experiment-071.yml"

jobs:
  verify-071:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - run: python experiments/experiment_071/run_experiment.py

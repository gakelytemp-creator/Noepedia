name: Experiment 033 Focused Verification

on:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_033/**"
      - ".github/workflows/experiment-033.yml"
  workflow_dispatch:

jobs:
  verify-033:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_033/run_experiment.py
name: Experiment 062 Strategy Policies

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_062/**"
      - ".github/workflows/experiment-062.yml"
  workflow_dispatch:

jobs:
  verify-062:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_062/run_experiment.py
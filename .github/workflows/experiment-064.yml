name: Experiment 064

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_064/**"
      - ".github/workflows/experiment-064.yml"
  workflow_dispatch:

jobs:
  verify-064:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_064/run_experiment.py
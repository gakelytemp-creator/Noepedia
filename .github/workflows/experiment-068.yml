name: Experiment 068 Stable Window Blind Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/experiment_068/**"
      - ".github/workflows/experiment-068.yml"

jobs:
  verify-068:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - run: python experiments/experiment_068/run_experiment.py

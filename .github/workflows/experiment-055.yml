name: Experiment 055 Relation Pair Discovery

on:
  push:
    branches: [main]
    paths:
      - "core/revision/**"
      - "experiments/experiment_055/**"
      - ".github/workflows/experiment-055.yml"
  workflow_dispatch:

jobs:
  verify-055:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/experiment_055/run_experiment.py